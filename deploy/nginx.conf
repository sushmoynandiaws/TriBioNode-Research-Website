# Include inside a server block configured for the real domain and HTTPS.
# Set root to the absolute directory containing the deployed dist/ contents.
include mime.types;
default_type application/octet-stream;
gzip on;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/csv;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

location / {
    try_files $uri $uri/ =404;
    expires -1;
}

location /assets/ {
    try_files $uri =404;
    expires 1y;
}
